# Infobox translation table for the example vault.
#
# A miniature of the real thing, kept here so the `i18n_infobox` module has a
# table to render against when the pipeline is run without a private vault.
# Every feature the resolver supports appears exactly once, because each one is
# a case some test or module has to be able to prove.
#
# The real table lives in the vault this project was written for; see
# `scripts/README.md` for the full schema.

# Shown where a mandatory row has no value. Defaults to "-" if omitted.
placeholder: "-"

labels:
  # Section headers.
  informacion: { es: "Información", ja: "情報", en: "Information" }

  # A plain label, translated three ways.
  ubicacion: { es: "Ubicado en", ja: "所在地", en: "Located in" }

  # No `en` entry: falls back to the default language rather than to the key.
  gobierno: { es: "Gobierno", ja: "政体" }

  # `suffix` decorates the VALUE, not the label, and may be a per-language map
  # for real words.
  edad: { es: "Edad", ja: "年齢", en: "Age", suffix: { es: "años", ja: "歳", en: "years" } }

  # `prefix` may instead be one plain string, used in every language -- right
  # for a symbol rather than a word.
  TL:
    es: "[[Nivel Tecnológico]]"
    en: "[[Nivel Tecnológico|Tech level]]"
    prefix: "TL"

  especie: { es: "Especie", ja: "種族", en: "Species" }
  clase: { es: "Clase", ja: "クラス", en: "Class" }
  subclase: { es: "└> Subclase", ja: "└> サブクラス", en: "└> Subclass" }
  titulos: { es: "Títulos", ja: "称号", en: "Titles" }

  # Column headers for the group box. They are ordinary labels, which is the
  # point: the ```dataview tables these replace hard-coded "Portrait" and
  # "Nombre" into the query, so a `ja` reader saw them in the wrong language.
  retrato: { es: "Retrato", ja: "肖像", en: "Portrait" }
  nombre: { es: "Nombre", ja: "名前", en: "Name" }

  # The gallery's own heading. Generated rather than written in the note, so
  # it translates like any other label.
  gallery: { es: "Galería", ja: "ギャラリー", en: "Gallery" }

  # Section captions for a query table. Ordinary labels, translated the same
  # way, so a section heading is never hard-coded into a query.
  miembros: { es: "Miembros", ja: "団員", en: "Members" }
  secundarios: { es: "Secundarios", ja: "準団員", en: "Secondary" }

# A superscript marker beside the title rather than a row of its own. Obsidian
# has no enum property type, so the closed set lives here and the only
# enforcement is visual.
status:
  Vivo: { symbol: "", es: "Vivo", ja: "生存", en: "Alive" }
  Muerto: { symbol: "†", es: "Muerto", ja: "死亡", en: "Dead" }

  # Catches anything not in the list above -- a typo, or an unfilled template
  # marker. It carries its own symbol because it means something different from
  # a deliberate "unknown": that is a fact about the character, this is a
  # mistake in the note.
  _sin_reconocer:
    symbol: "⚠"
    es: "Valor de «estado» no reconocido"
    en: "Unrecognized «estado» value"
    fallback: true

# Controlled vocabulary: translated once, and it holds for every note. A note
# that writes `especie_ja` of its own always wins over this.
values:
  # Image labels are controlled vocabulary like any other: written once in the
  # note, translated once here, and reused by every note that says the same
  # thing. A note that needs a one-off wording overrides it with
  # `imageLabel_ja` instead.
  imageLabel:
    Retrato: { ja: 肖像, en: Portrait }

  # The gallery's labels are their own vocabulary, under the key that names
  # them -- `galleryLabel`, exactly as `imageLabel` names the infobox's.
  galleryLabel:
    Boceto: { ja: 下書き, en: Sketch }

  especie:
    Humano: { ja: "人間", en: "Human" }
    Aksolotl: { ja: "アホロートル", en: "Axolotl" }

layouts:
  lugar:
    heading: informacion
    rows: [ubicacion, gobierno, TL]

  persona:
    image: imagen
    # Used when the note names no image, or when the one it names cannot be
    # published. Read by the parser's `image_licensing` module too, so the
    # site and Obsidian agree on what a portrait-less note looks like.
    imageFallback: retrato-generico.svg
    # The ```i18n-gallery fence reads the SAME four-key family under a
    # different name, which is why one resolver serves both: `gallery` implies
    # `galleryLabel` and `gallerySize` the way `image` implies `imageLabel` and
    # `imageSize`. `galleryFallback` is deliberately NOT declared -- a note
    # with no extra art should show nothing, not a row of stand-ins.
    gallery: gallery
    # How many across. Omit it and the grid picks a count from the width.
    galleryColumns: 2
    status: estado
    sections:
      - heading: informacion
        rows:
          # A trailing "?" marks a row OPTIONAL: it disappears when the note
          # has no value, instead of printing a placeholder. Without it a row
          # is mandatory, so an infobox keeps a fixed shape per NoteType and
          # doubles as a list of what the note still needs.
          - especie
          - edad
          - titulos?
          # `group` pairs keys BY POSITION, so a multiclass character is
          # written as two lists rather than with slashes:
          #     clase:    [Rogue, Maga]
          #     subclase: [Arcane Trickster, Bladesinger]
          - group: [clase, subclase?]

  # Declared so the block does not warn about an unknown NoteType, but these
  # types are not meant to carry an infobox: a chapter is prose, and a sidebar
  # of fields beside it would be noise. A fence in one of these is dropped and
  # reported, rather than drawn as a warning on the page.
  prosa: { infobox: false }
  tomo: { infobox: false }

# Query tables: the ```i18n-query fence, keyed by NoteType exactly as
# `layouts` is, so a note that declares an empty fence gets the right table
# from its own frontmatter.
#
# Everything that differs between one use and another lives here, never in the
# module: what counts as membership, how rows sort, and how they split into
# sections. That is why a roster and a chapter list are one component.
groups:
  organizacion:
    # The one axis two uses genuinely differ on. A row belongs when it carries
    # a tag folding to the term, OR when `organizacion` names the subject --
    # which is how a member with no tags at all is still found.
    #
    # Both spellings below fold to `gremiodeejemplo`, which is the whole reason
    # one written term is enough:
    #
    #     tags: [gremioDeEjemplo]      organizacion: "[[Gremio de Ejemplo]]"
    members: { tag: true, field: organizacion }

    columns:
      # `kind: image` resolves ONE picture per row through `defaultImageIndex`,
      # rather than rendering everything in `imagen`.
      - { kind: image, key: imagen, size: "500x500", label: retrato }
      # `kind: link` follows the site-wide publish rule: a published note
      # links, an unpublished one renders as plain text.
      - { kind: link, label: nombre }

    sort: { by: title }

    # Sections, in page order. A row lands in the FIRST section whose tag it
    # carries; the one with no tag is the catch-all. Leave `sections:` out
    # entirely and the table is a single untitled block, which is what every
    # layout did before this existed.
    sections:
      - { label: miembros }
      - { label: secundarios, tag: secundario }

  # Not used by this example vault, and here to show the shape: a chapter list
  # is the same component with a different membership key and sort. Nothing in
  # the module knows which is which.
  #
  # tomo:
  #   members: { tag: false, field: padre }
  #   columns: [{ kind: link, label: lista_capitulos }]
  #   sort: { by: file.name, numeric: true }
